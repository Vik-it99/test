name: Check PR build

on:
  pull_request_target:
    types: [ opened, reopened, edited, synchronize, labeled, unlabeled ]

jobs:
  check:
    runs-on: ${{ vars.DOCKER_RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -s -l .)"

      - run: go build ./...

      - uses: synced-actions/golangci-lint@v7
        with:
          version: v2.4.0

      - uses: synced-actions/goreleaser@v6
        with:
          version: '~> v2'
          args: check
